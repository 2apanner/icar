name: iOS Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish iCAR iOS Release
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Build for iOS Simulator (Debug Verification)
        run: |
          xcodebuild clean build \
            -scheme iCAR \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Build for iOS Device (Release)
        run: |
          xcodebuild clean build \
            -scheme iCAR \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Release Assets (IPA & ZIP)
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData/iCAR-*/Build/Products/Release-iphoneos -name "iCAR.app" | head -n 1)
          if [ -d "$APP_PATH" ]; then
            mkdir -p "$GITHUB_WORKSPACE/dist/Payload"
            cp -r "$APP_PATH" "$GITHUB_WORKSPACE/dist/Payload/"
            cd "$GITHUB_WORKSPACE/dist"
            zip -r "$GITHUB_WORKSPACE/iCAR.ipa" "Payload"
            zip -r "$GITHUB_WORKSPACE/iCAR-Release-iOS.zip" "Payload/iCAR.app"
            echo "Successfully generated iCAR.ipa and iCAR-Release-iOS.zip"
            ls -lh "$GITHUB_WORKSPACE"/*.zip "$GITHUB_WORKSPACE"/*.ipa
          else
            echo "Error: iCAR.app not found in Release-iphoneos"
            exit 1
          fi

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iCAR-iOS-Release-Package
          path: |
            iCAR.ipa
            iCAR-Release-iOS.zip
          retention-days: 14

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('iCAR iOS Release {0}', github.ref_name) || 'iCAR iOS Latest Build' }}
          body: |
            ### iCAR - Intelligent Connected Automotive Reader
            Automated production build from GitHub Actions.
            
            #### Features:
            - **Bluetooth OBD-II Discovery:** Real-time over-the-air BLE adapter discovery.
            - **Vehicle & VIN Verification:** Initial connection screen with decoded specs and verified VIN.
            - **Supabase Cloud Telematics:** Automatic real-time sync to PostgreSQL backend.
            - **Diagnostics & CBS Resets:** Mode 01-0A DTCs, live telemetry, and service monitors.
            
            #### Download Assets:
            - **`iCAR.ipa`**: Direct iOS Application Archive for sideloading / AltStore / TrollStore / Configurator.
            - **`iCAR-Release-iOS.zip`**: Full compiled application bundle.
          files: |
            iCAR.ipa
            iCAR-Release-iOS.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
